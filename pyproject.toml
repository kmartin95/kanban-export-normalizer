[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanban-export-normalizer"
version = "0.1.0"
description = "Normalize kanban board exports from Trello, Jira, Asana, and GitHub Projects into one data model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kmartin95" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
